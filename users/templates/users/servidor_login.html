<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso do Servidor</title>
</head>
<body>
    <nav>
        <a href="/">Home</a>
    </nav>
    
    <h1>Painel do Servidor - Login</h1>
    <p>Acesso restrito a profissionais autorizados.</p>

    {% if form.errors %}
        <p style="color: red;">Usuário ou senha incorretos. Tente novamente.</p>
    {% endif %}

    <form class="form-with-validation" action="{% url 'users:login_servidor' %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
